[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worktree-flow"
version = "0.1.0"
description = "Safe Git worktree workflows for parallel development and AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Varun Ruhella"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
worktree-flow = "worktree_flow.cli:main"
worktree_flow = "worktree_flow.cli:main"

[tool.setuptools.packages.find]
include = ["worktree_flow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
